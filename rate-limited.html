<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Checkpoint - Chatterloop</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        max-width: 440px;
        padding: 40px;
        background-color: #1e293b;
        border-radius: 12px;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.3),
          0 8px 10px -6px rgba(0, 0, 0, 0.3);
        text-align: center;
        border: 1px solid #334155;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 20px;
        color: #f59e0b;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 12px;
        font-weight: 700;
        color: #ffffff;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .timer {
        font-weight: 600;
        color: #38bdf8;
      }
      .btn {
        display: inline-block;
        background-color: #2563eb;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-weight: 500;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">⚠️</div>
      <h1>Hold on a second...</h1>
      <p>
        We detected unusual activity or rapid page refreshing from your
        connection. To protect the application workspace, access is temporarily
        paused.
      </p>
      <p>
        Please wait <span class="timer">30 seconds</span> before trying to
        reload or navigate back into your console.
      </p>
      <a href="/" class="btn">Return to Chatterloop</a>
    </div>
  </body>
</html>
